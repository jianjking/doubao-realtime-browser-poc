<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆包 Realtime 浏览器 Barge-in POC</title>
  <style>
    body {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: sans-serif;
      line-height: 1.5;
    }

    button {
      margin-right: 8px;
      padding: 8px 14px;
    }

    #connectionState,
    #microphoneState,
    #playbackState,
    #turnState {
      margin: 16px 0;
      font-weight: 600;
    }

    #logOutput {
      min-height: 220px;
      padding: 12px;
      overflow: auto;
      border: 1px solid #bbb;
      background: #f7f7f7;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>豆包 Realtime 浏览器 Barge-in POC</h1>

  <div>
    <button id="connectButton" type="button">连接 Relay</button>
    <button id="disconnectButton" type="button">断开 Relay</button>
  </div>

  <div id="connectionState" role="status">状态：未连接</div>

  <div>
    <button id="startMicrophoneButton" type="button">
      开始实时对话
    </button>
    <button id="stopMicrophoneButton" type="button">
      停止实时对话
    </button>
  </div>

  <div id="microphoneState" role="status">
    麦克风：未启动
  </div>
  <div id="playbackState" role="status">
    播放：未开始
  </div>
  <div id="turnState" role="status">
    当前对话：等待开始
  </div>
  <pre id="logOutput" aria-label="运行日志"></pre>

  <script src="/doubao_mic_single_turn.js"></script>
</body>
</html>
