<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#481a20">
  <title>上香求签 · 传统文化智慧陪伴</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./entry.css">
</head>
<body>
  <main class="entry-shell fortune-page" aria-labelledby="fortune-title">
    <div class="entry-ambient" aria-hidden="true">
      <span class="entry-halo"></span>
      <span class="entry-cloud entry-cloud-left"></span>
      <span class="entry-cloud entry-cloud-right"></span>
    </div>

    <header class="entry-heading fortune-heading">
      <p class="entry-kicker">静心入殿</p>
      <h1 id="fortune-title">上香求签</h1>
      <p class="fortune-introduction">神明高坐庙堂，道童在殿前引导求签。</p>
    </header>

    <section class="temple-scene" aria-labelledby="temple-scene-title">
      <h2 id="temple-scene-title">神明高坐庙堂</h2>
      <div class="sanctuary" role="img" aria-label="神明高坐神龛，殿内供灯散发柔和金光">
        <span class="sanctuary-canopy" aria-hidden="true"></span>
        <span class="offering-lamp offering-lamp-left" aria-hidden="true"></span>
        <span class="offering-lamp offering-lamp-right" aria-hidden="true"></span>
        <div class="deity-seat" aria-hidden="true">
          <span class="deity-halo"></span>
          <span class="deity-silhouette"></span>
          <span class="deity-tablet">神明</span>
        </div>
      </div>
      <p>神明居于庙堂高处，安然接受香火与祈愿。</p>
    </section>

    <section class="offering-stage" aria-labelledby="offering-stage-title">
      <h2 id="offering-stage-title">殿前香案</h2>
      <div class="incense-table" aria-label="香炉与一炷未点燃的香">
        <div class="incense-stick" aria-hidden="true">
          <span class="incense-ember"></span>
          <span class="incense-smoke incense-smoke-one"></span>
          <span class="incense-smoke incense-smoke-two"></span>
        </div>
        <div class="incense-burner" aria-hidden="true">
          <span class="burner-rim"></span>
          <span class="burner-body">福</span>
          <span class="burner-foot burner-foot-left"></span>
          <span class="burner-foot burner-foot-right"></span>
        </div>
      </div>
      <p class="incense-state" data-incense-state aria-live="polite">香尚未点燃</p>
    </section>

    <section class="acolyte-guide" aria-labelledby="acolyte-guide-title">
      <div class="acolyte-silhouette" aria-hidden="true">
        <span class="acolyte-head"></span>
        <span class="acolyte-body"></span>
      </div>
      <div class="acolyte-copy">
        <h2 id="acolyte-guide-title">道童引导</h2>
        <p data-acolyte-guidance aria-live="polite" aria-atomic="true">善信请静心，先敬上一炷香。</p>
      </div>
    </section>

    <button class="offer-incense-button" type="button" data-offer-incense>敬上一炷香</button>

    <section class="waiting-to-speak" data-waiting-state aria-labelledby="waiting-to-speak-title" hidden>
      <div class="speech-state-heading">
        <h2 id="waiting-to-speak-title" data-speech-title>等待诉说</h2>
        <span class="microphone-use-indicator" aria-hidden="true">麦克风使用中</span>
      </div>
      <p data-speech-message role="status" aria-live="polite" aria-atomic="true">请慢慢说，道童会在殿前听您诉说。</p>
      <button class="speak-control-button" type="button" data-speak-control>开始诉说</button>
      <small data-speech-detail>本阶段只使用麦克风，不录制或上传音频。</small>
    </section>

    <a class="return-choice-button" href="./choice.html">返回功能选择</a>
  </main>
  <script src="./fortune.js"></script>
</body>
</html>
