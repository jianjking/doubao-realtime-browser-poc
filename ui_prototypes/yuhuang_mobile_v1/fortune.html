<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#481a20">
  <title>上香求签 · 传统文化智慧陪伴</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./entry.css">
</head>
<body>
  <main class="entry-shell fortune-page" aria-labelledby="fortune-title">
    <div class="entry-ambient" aria-hidden="true">
      <span class="entry-halo"></span>
      <span class="entry-cloud entry-cloud-left"></span>
      <span class="entry-cloud entry-cloud-right"></span>
    </div>

    <header class="entry-heading fortune-heading">
      <p class="entry-kicker">庙堂求签</p>
      <h1 id="fortune-title">上香求签</h1>
      <p class="fortune-introduction">神明高坐庙堂，道童在殿前引导求签。</p>
    </header>

    <section class="fortune-section" aria-labelledby="fortune-flow-title">
      <h2 id="fortune-flow-title">求签流程预告</h2>
      <p class="fortune-flow">敬香 <span>→</span> 诉说处境 <span>→</span> 抽取签文 <span>→</span> 道童解签</p>
    </section>

    <section class="fortune-section role-boundary" aria-labelledby="role-boundary-title">
      <h2 id="role-boundary-title">神仙与道童各司其职</h2>
      <p><strong>神仙：</strong>高坐庙堂，接受香火与祈愿。</p>
      <p><strong>道童：</strong>负责后续引导、接签和解签。</p>
    </section>

    <section class="fortune-status" aria-labelledby="fortune-status-title">
      <h2 id="fortune-status-title">求签功能正在搭建</h2>
      <p>本阶段先展示入口与流程定位，暂时不能开始求签。</p>
      <button type="button" disabled aria-describedby="fortune-status-title">开始求签</button>
    </section>

    <a class="return-choice-button" href="./choice.html">返回功能选择</a>
  </main>
</body>
</html>
