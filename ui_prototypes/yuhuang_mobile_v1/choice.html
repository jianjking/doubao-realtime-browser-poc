<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#481a20">
  <title>功能选择 · 传统文化智慧陪伴</title>

  <link rel="stylesheet" href="./entry.css">

<body>
  <main class="entry-shell choice-page" aria-labelledby="choice-title">
    <div class="entry-ambient" aria-hidden="true">
      <span class="entry-halo"></span>
      <span class="entry-cloud entry-cloud-left"></span>
      <span class="entry-cloud entry-cloud-right"></span>
    </div>

    <header class="entry-heading">
      <p class="entry-kicker">传统文化智慧陪伴</p>
      <h1 id="choice-title">今天想体验什么？</h1>
      <p>请选择一项，我们陪您慢慢来。</p>
    </header>

    <nav class="feature-choice-list" aria-label="功能选择">
      <a class="feature-card feature-card-call" href="./home.html">
        <span class="feature-card-mark" aria-hidden="true">话</span>
        <span class="feature-card-copy">
          <strong>与神仙通话</strong>
          <span>听您慢慢说</span>
        </span>
        <span class="feature-card-action" aria-hidden="true">进入</span>
      </a>

      <a class="feature-card feature-card-fortune" href="./fortune.html">
        <span class="feature-card-mark" aria-hidden="true">签</span>
        <span class="feature-card-copy">
          <strong>上香求签</strong>
          <span>静心诉说，诚心求一签</span>
        </span>
        <span class="feature-card-action" aria-hidden="true">进入</span>
      </a>
    </nav>

    <p class="entry-footnote">轻触上方任一大按钮即可进入</p>
