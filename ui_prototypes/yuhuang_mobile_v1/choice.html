<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a0d11">
  <title>功能选择 · 传统文化智慧陪伴</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --app-height: 100vh; }
    @supports (height: 100dvh) { :root { --app-height: 100dvh; } }
    html.is-xianban-loading,
    html.is-xianban-loading body { overflow: hidden; }
    .xianban-startup-loader {
      --loader-run-distance: min(220px, calc(100vw - 170px));
      position: fixed;
      z-index: 2147483000;
      inset: 0;
      display: grid;
      width: 100%;
      height: var(--app-height, 100vh);
      overflow: hidden;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
      color: #fff3cf;
      background:
        radial-gradient(ellipse at 50% 29%, rgba(255, 218, 135, 0.26) 0%, rgba(184, 95, 54, 0.12) 35%, transparent 60%),
        linear-gradient(180deg, #742530 0%, #48141e 52%, #22090f 100%);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      isolation: isolate;
      transition: opacity 380ms ease, visibility 380ms ease;
    }
    .xianban-startup-loader::before,
    .xianban-startup-loader::after {
      position: absolute;
      z-index: -1;
      right: -14%;
      left: -14%;
      content: "";
      pointer-events: none;
    }
    .xianban-startup-loader::before {
      top: 4%;
      height: 32%;
      opacity: 0.34;
      background:
        radial-gradient(ellipse at 12% 78%, rgba(255, 238, 194, 0.44) 0 18%, transparent 19%),
        radial-gradient(ellipse at 45% 62%, rgba(255, 230, 176, 0.28) 0 22%, transparent 23%),
        radial-gradient(ellipse at 83% 76%, rgba(255, 238, 194, 0.38) 0 20%, transparent 21%);
      filter: blur(7px);
      animation: xianban-cloud-drift 16s ease-in-out infinite alternate;
    }
    .xianban-startup-loader::after {
      bottom: -7%;
      height: 34%;
      opacity: 0.42;
      background:
        radial-gradient(ellipse at 8% 42%, rgba(241, 201, 135, 0.34) 0 24%, transparent 25%),
        radial-gradient(ellipse at 50% 66%, rgba(255, 225, 166, 0.32) 0 28%, transparent 29%),
        radial-gradient(ellipse at 92% 40%, rgba(241, 201, 135, 0.3) 0 23%, transparent 24%);
      filter: blur(9px);
      animation: xianban-cloud-drift 20s ease-in-out infinite alternate-reverse;
    }
    .xianban-startup-loader.is-complete { visibility: hidden; opacity: 0; }
    .xianban-loader-panel {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(100%, 370px);
      max-height: 100%;
      align-content: center;
      justify-items: center;
      gap: clamp(7px, 1.3vh, 13px);
      text-align: center;
    }
    .xianban-loader-brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .xianban-loader-seal {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 2px solid #d9ae58;
      border-radius: 50%;
      color: #f8d987;
      background: rgba(87, 24, 32, 0.78);
      box-shadow: 0 0 0 4px rgba(217, 174, 88, 0.12), 0 8px 22px rgba(18, 3, 7, 0.26);
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 27px;
      font-weight: 800;
    }
    .xianban-loader-title { margin: 0; font-size: 31px; font-weight: 800; letter-spacing: 0.12em; line-height: 1.2; }
    .xianban-loader-runway {
      position: relative;
      width: min(100%, 320px);
      height: clamp(72px, 13vh, 104px);
      overflow: hidden;
    }
    .xianban-loader-runway::before {
      position: absolute;
      right: 0;
      bottom: 11px;
      left: 0;
      height: 30px;
      border-top: 1px solid rgba(246, 208, 124, 0.36);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 18% 68%, rgba(255, 238, 199, 0.72) 0 18%, transparent 19%),
        radial-gradient(ellipse at 48% 74%, rgba(255, 230, 177, 0.62) 0 22%, transparent 23%),
        radial-gradient(ellipse at 79% 66%, rgba(255, 238, 199, 0.7) 0 19%, transparent 20%);
      content: "";
      filter: blur(1px);
    }
    .xianban-loader-runner {
      position: absolute;
      bottom: 13px;
      left: 3px;
      width: 68px;
      height: 80px;
      will-change: transform;
      animation: xianban-monkey-run 6.6s ease-in-out infinite;
    }
    .xianban-loader-monkey {
      display: block;
      width: 68px;
      height: 80px;
      object-fit: cover;
      object-position: 50% 38%;
      clip-path: ellipse(42% 48% at 50% 50%);
      filter: drop-shadow(0 7px 7px rgba(25, 3, 7, 0.42));
    }
    .xianban-loader-monkey[hidden] { display: none; }
    .xianban-loader-copy { margin: 0; color: #f4deb0; font-size: 17px; line-height: 1.45; }
    .xianban-loader-stage { margin: 0; color: #fff8e2; font-size: 18px; font-weight: 800; line-height: 1.4; }
    .xianban-loader-progress {
      position: relative;
      width: 100%;
      height: 14px;
      overflow: hidden;
      border: 1px solid rgba(239, 207, 132, 0.56);
      border-radius: 999px;
      background: rgba(19, 4, 8, 0.72);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.34);
    }
    .xianban-loader-progress > span {
      position: relative;
      display: block;
      width: 12%;
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background: linear-gradient(90deg, #c99039, #f4d483 52%, #d7a64d);
      box-shadow: 0 0 12px rgba(243, 202, 112, 0.38);
    }
    .xianban-loader-progress > span::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 10%, rgba(255, 255, 255, 0.34) 48%, transparent 82%);
      content: "";
      transform: translate3d(-110%, 0, 0);
      animation: xianban-progress-shine 2.8s ease-in-out infinite;
    }
    .xianban-loader-percent { margin: -3px 0 0; color: #fff8e6; font-size: 25px; font-variant-numeric: tabular-nums; font-weight: 800; line-height: 1.1; }
    .xianban-loader-estimate {
      display: grid;
      min-height: 44px;
      align-content: center;
      gap: 2px;
      margin: 0;
      color: #f3d99e;
      line-height: 1.4;
    }
    .xianban-loader-estimate span { font-size: 14px; }
    .xianban-loader-estimate strong { color: #fff1c9; font-size: 16px; font-weight: 700; }
    .xianban-loader-comfort,
    .xianban-loader-status,
    .xianban-loader-reload-note {
      width: 100%;
      margin: 0;
      color: #f4dfae;
      font-size: 16px;
      line-height: 1.45;
    }
    .xianban-loader-comfort { min-height: 46px; opacity: 0; }
    .xianban-loader-comfort.is-visible { opacity: 1; transition: opacity 420ms ease; }
    .xianban-loader-status { min-height: 46px; font-weight: 700; }
    .xianban-loader-reload-note { min-height: 23px; color: #ead39d; font-size: 14px; }
    .xianban-loader-comfort[hidden],
    .xianban-loader-status[hidden],
    .xianban-loader-reload-note[hidden],
    .xianban-loader-reload[hidden] { display: none; }
    .xianban-loader-reload {
      min-width: 152px;
      min-height: 52px;
      padding: 8px 22px;
      border: 2px solid #f1d083;
      border-radius: 12px;
      color: #3a1015;
      background: linear-gradient(180deg, #f7d989, #e9b957);
      box-shadow: 0 8px 20px rgba(27, 4, 8, 0.28);
      font-size: 18px;
      font-weight: 800;
    }
    .xianban-loader-reload:disabled { opacity: 0.7; }
    @keyframes xianban-cloud-drift {
      from { transform: translate3d(-2%, 0, 0); }
      to { transform: translate3d(2%, 3px, 0); }
    }
    @keyframes xianban-monkey-run {
      0%, 4% { transform: translate3d(0, 4px, 0) scaleX(1); }
      47% { transform: translate3d(var(--loader-run-distance), -4px, 0) scaleX(1); }
      52% { transform: translate3d(var(--loader-run-distance), -4px, 0) scaleX(-1); }
      96% { transform: translate3d(0, 3px, 0) scaleX(-1); }
      100% { transform: translate3d(0, 4px, 0) scaleX(1); }
    }
    @keyframes xianban-progress-shine {
      0%, 24% { transform: translate3d(-110%, 0, 0); }
      70%, 100% { transform: translate3d(110%, 0, 0); }
    }
    @keyframes xianban-monkey-breathe {
      0%, 100% { transform: translate3d(0, 2px, 0) scale(0.98); }
      50% { transform: translate3d(0, -2px, 0) scale(1.02); }
    }
    @media (max-height: 680px) {
      .xianban-startup-loader { padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
      .xianban-loader-panel { gap: 6px; }
      .xianban-loader-seal { width: 42px; height: 42px; font-size: 24px; }
      .xianban-loader-title { font-size: 27px; }
      .xianban-loader-runway { height: 70px; }
      .xianban-loader-runner { bottom: 7px; transform-origin: bottom center; }
      .xianban-loader-copy { font-size: 16px; }
      .xianban-loader-comfort,
      .xianban-loader-status { min-height: 41px; }
      .xianban-loader-reload { min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .xianban-startup-loader { transition: none; }
      .xianban-startup-loader::before,
      .xianban-startup-loader::after,
      .xianban-loader-progress > span::after { animation: none; }
      .xianban-loader-runner { animation: xianban-monkey-breathe 3.6s ease-in-out infinite; }
      .xianban-loader-comfort.is-visible { transition: none; }
    }
  </style>
  <script>
    document.documentElement.classList.add('is-xianban-loading');
    window.__xianbanStartupAt = window.performance.now();
    document.documentElement.style.setProperty(
      '--app-height',
      Math.round((window.visualViewport && window.visualViewport.height) || window.innerHeight) + 'px'
    );
  </script>
  <link rel="stylesheet" href="./choice-poster.css">
</head>
<body data-startup-app="static">
  <div class="xianban-startup-loader" data-xianban-loader role="status" aria-live="polite" aria-label="页面正在加载">
    <div class="xianban-loader-panel">
      <div class="xianban-loader-brand">
        <div class="xianban-loader-seal" aria-hidden="true">仙</div>
        <p class="xianban-loader-title">仙伴</p>
      </div>
      <div class="xianban-loader-runway" aria-hidden="true">
        <span class="xianban-loader-runner">
          <img
            class="xianban-loader-monkey"
            data-loader-monkey
            src="./assets/characters/sunwukong/sunwukong-loader-runner-v1.webp"
            width="272"
            height="320"
            alt=""
            aria-hidden="true"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
            onerror="this.hidden=true">
        </span>
      </div>
      <p class="xianban-loader-copy">正在连接仙境，请稍候……</p>
      <p class="xianban-loader-stage" data-loader-stage>正在打开仙伴</p>
      <div class="xianban-loader-progress" role="progressbar" aria-label="页面加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12">
        <span data-loader-progress-bar></span>
      </div>
      <p class="xianban-loader-percent" data-loader-progress-text>12%</p>
      <p class="xianban-loader-estimate">
        <span>预计等待</span>
        <strong data-loader-estimate-text>预计还需 5～10 秒</strong>
      </p>
      <p class="xianban-loader-comfort is-visible" data-loader-comfort>首次打开可能稍慢，请您耐心等一会儿</p>
      <p class="xianban-loader-status" data-loader-status hidden></p>
      <p class="xianban-loader-reload-note" data-loader-reload-note hidden>如果长时间没有进入，可以尝试重新加载</p>
      <button class="xianban-loader-reload" data-loader-reload type="button" hidden>重新加载</button>
    </div>
  </div>
  <main class="choice-page" aria-label="功能选择页面">
    <div class="choice-poster-stage">
      <div class="choice-poster-frame">
        <picture>
          <source
            srcset="./assets/choice/choice-poster-unified-v2.webp"
            type="image/webp">
          <img
          class="choice-poster-image"
          src="./assets/choice/choice-poster-unified-v2.png"
          width="852"
          height="1846"
          alt="传统文化智慧陪伴功能选择页"
          draggable="false"
          decoding="async"
          fetchpriority="high"
          data-startup-critical-image>
        </picture>

        <header class="choice-page-copy">
          <p>传统文化智慧陪伴</p>
          <h1>今天想体验什么？</h1>
          <span>请选择一项，我们陪您慢慢来。</span>
        </header>

        <a
          class="feature-card feature-card-call choice-link choice-link-call"
          href="./home.html"
          aria-label="进入与神仙通话">
          <span class="choice-card-accessible-copy">
            <strong>与神仙通话</strong>
            <span>听您慢慢说</span>
          </span>
          <span class="call-card-enter">进入 <span aria-hidden="true">›</span></span>
          <span class="landline-phone" aria-hidden="true">
            <svg viewBox="0 0 160 132" focusable="false" aria-hidden="true">
              <defs>
                <linearGradient id="landline-shell-gradient" x1="0" x2="1" y1="0" y2="1">
                  <stop offset="0" stop-color="#b94735" />
                  <stop offset="0.52" stop-color="#7d1e22" />
                  <stop offset="1" stop-color="#3e0c13" />
                </linearGradient>
                <linearGradient id="landline-body-gradient" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stop-color="#b23d31" />
                  <stop offset="0.62" stop-color="#771a20" />
                  <stop offset="1" stop-color="#450d15" />
                </linearGradient>
                <filter id="landline-shadow" x="-30%" y="-30%" width="160%" height="180%">
                  <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#21070b" flood-opacity="0.72" />
                </filter>
              </defs>
              <ellipse class="landline-shadow" cx="80" cy="120" rx="57" ry="8" />
              <path
                class="landline-receiver"
                d="M31 26c7-13 18-18 29-14l13 5c5 2 7 8 5 13l-3 7h10l-3-7c-2-5 0-11 5-13l13-5c11-4 22 1 29 14l4 8c3 7 0 14-7 17l-18 7c-6 2-12-1-14-7l-2-6H68l-2 6c-2 6-8 9-14 7l-18-7c-7-3-10-10-7-17z"/>
              <path class="landline-receiver-highlight" d="M35 27c7-10 15-13 23-10l10 4c2 1 3 3 2 5l-3 7h-8l-11-4c-5-2-9-1-13 2z" />
              <path
                class="landline-body"
                d="M42 50h76l21 58c2 7-3 14-11 14H32c-8 0-13-7-11-14z"/>
              <path class="landline-body-front" d="M29 105h102l5 9c2 5-2 8-8 8H32c-6 0-10-3-8-8z" />
              <circle class="landline-dial" cx="80" cy="84" r="24"/>
              <circle class="landline-dial-ring" cx="80" cy="84" r="18"/>
              <circle class="landline-dial-center" cx="80" cy="84" r="8"/>
              <g class="landline-dial-holes">
                <circle cx="80" cy="66" r="3"/>
                <circle cx="94" cy="73" r="3"/>
                <circle cx="98" cy="88" r="3"/>
                <circle cx="89" cy="100" r="3"/>
                <circle cx="71" cy="100" r="3"/>
                <circle cx="62" cy="88" r="3"/>
                <circle cx="66" cy="73" r="3"/>
              </g>
            </svg>
          </span>
        </a>

        <a
          class="feature-card feature-card-fortune choice-link choice-link-fortune"
          href="./fortune.html?characterKey=guanyin"
          aria-label="进入上香求签">
          <span class="fortune-card-copy">
            <strong>上香求签</strong>
            <span>静心诉说，诚心求一签</span>
          </span>
          <span class="fortune-card-enter">进入 <span aria-hidden="true">›</span></span>
        </a>

        <p class="choice-footer-copy">轻触上方任一大按钮即可进入</p>
      </div>
    </div>
  </main>
  <script
    src="./startup-loader.js"
    onerror="document.querySelector('[data-loader-comfort]').hidden=true;document.querySelector('[data-loader-status]').hidden=false;document.querySelector('[data-loader-status]').textContent='加载程序未能启动，请重新加载';document.querySelector('[data-loader-reload-note]').hidden=false;document.querySelector('[data-loader-reload]').hidden=false;document.querySelector('[data-loader-reload]').onclick=function(){this.disabled=true;window.location.reload()}"></script>
</body>
</html>
